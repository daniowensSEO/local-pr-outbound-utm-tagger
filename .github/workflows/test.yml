name: Test

# Runs the WordPress.org quality gates and the HTML/JS parity tests on every push / PR.
# Third-party actions are pinned to full commit SHAs (supply-chain safety); the
# trailing comment records the release each SHA corresponds to.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (PHPCS + WordPress-Coding-Standards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          tools: composer
      - name: Validate composer.json
        run: composer validate --strict --no-check-publish
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      - name: Run PHPCS
        run: composer run lint

  parity:
    name: HTML/JS parity (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring
          coverage: none
      - name: HTML mode (PHP)
        run: php tests/parity/run-php.php
      - name: JavaScript mode (Node)
        run: node tests/parity/run-js.mjs

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build a clean distributable copy (only what ships to WP.org)
        run: |
          mkdir -p build/outbound-utm-tagger
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='.wordpress-org' \
            --exclude='tests' --exclude='vendor' --exclude='node_modules' \
            --exclude='.distignore' --exclude='.gitignore' --exclude='.editorconfig' \
            --exclude='composer.json' --exclude='composer.lock' \
            --exclude='phpcs.xml.dist' --exclude='phpunit.xml.dist' \
            --exclude='build' \
            ./ build/outbound-utm-tagger/
      - name: Run Plugin Check
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: ./build/outbound-utm-tagger
          slug: outbound-utm-tagger
