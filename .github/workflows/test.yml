name: Test

# Runs the WordPress.org quality gates, the HTML/JS parity tests and the PHPUnit integration tests
# (real WordPress + MySQL) on every branch push / PR, and as the gate inside deploy-wporg.yml
# (workflow_call). Third-party actions are pinned to full
# commit SHAs (supply-chain safety); the trailing comment records the release each SHA is.
# Runners are pinned to ubuntu-24.04 so the ubuntu-latest move to 26.04 can't change them silently.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to test (defaults to the triggering commit).'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  versions:
    name: Version numbers match
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - name: Header Version, readme Stable tag and class VERSION agree
        run: |
          header=$(sed -n 's/^[ *]*Version:[[:space:]]*//p' outbound-utm-tagger.php | head -1 | tr -d '[:space:]')
          stable=$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt | head -1 | tr -d '[:space:]')
          class=$(sed -n "s/.*const VERSION = '\([^']*\)'.*/\1/p" includes/class-outbound-utm-settings.php | head -1)
          echo "header=$header stable=$stable class=$class"
          if [ -z "$header" ] || [ "$header" != "$stable" ] || [ "$header" != "$class" ]; then
            echo "::error::Version mismatch: header=$header, readme Stable tag=$stable, class VERSION=$class"
            exit 1
          fi

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      # The release binary is pinned by version AND sha256 (from gitleaks' checksums file, matching
      # GitHub's asset digest), so a swapped download fails instead of running.
      - name: Install gitleaks 8.30.1 (checksum-pinned)
        run: |
          f=gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$f"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
      # .gitleaks.toml = the default rules plus WordPress application passwords, Basic auth headers
      # and credentials in URLs.
      - name: Scan every commit
        run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --config .gitleaks.toml --log-opts="--all" .

  lint:
    name: Lint (PHPCS + WordPress-Coding-Standards)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          tools: composer
      - name: Validate composer.json
        run: composer validate --strict --no-check-publish
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      - name: Run PHPCS
        run: composer run lint

  parity:
    name: HTML/JS parity (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring
          coverage: none
      - name: HTML mode (PHP)
        run: php tests/parity/run-php.php

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }}, WP ${{ matrix.wp }}${{ matrix.multisite == '1' && ', multisite' || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # max_skipped: the most skipped tests a leg may report. Three are plugin bugs left for 0.2.3,
        # each skipped only while it still gives its known wrong answer. The rest are uninstall tests
        # for the other kind of install: 2 multisite-only tests on a single site, 1 single-site-only
        # test on multisite. Lower these as the bugs are fixed.
        include:
          # 6.9 is the plugin's "Requires at least" (and the core filter page mode needs); 8.0 is "Requires PHP".
          - { php: '8.0', wp: '6.9', multisite: '0', max_skipped: 5 }
          - { php: '8.3', wp: 'latest', multisite: '0', max_skipped: 5 }
          - { php: '8.4', wp: 'latest', multisite: '0', max_skipped: 5 }
          - { php: '8.4', wp: 'latest', multisite: '1', max_skipped: 4 }
          # The newest PHP, as in the parity job.
          - { php: '8.5', wp: 'latest', multisite: '0', max_skipped: 5 }
    services:
      mysql:
        # MySQL 8.4 LTS (8.0's support ended in April 2026), pinned by digest like the actions above.
        # The digest is mysql:8.4's multi-arch index (8.4.11). Dependabot does not update it; refresh by hand.
        image: mysql:8.4@sha256:0744ee5ef89ce6ccfa13de3e579fe6b9e27f93dd70da9c06d2c908b1b193fb8d
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        # Pinged over TCP so it only reports healthy once the real server is up, not mysqld's
        # socket-only bootstrap instance.
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      WP_TESTS_DIR: /tmp/wordpress-tests-lib
      WP_CORE_DIR: /tmp/wordpress
      WP_MULTISITE: ${{ matrix.multisite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, intl, mbstring
          coverage: none
          tools: composer
      - name: Install dependencies (with dev)
        run: composer install --prefer-dist --no-progress
      # bin/install-wp-tests.sh is wp-cli/scaffold-command's template, unmodified. It fetches the
      # test suite as a wordpress-develop tarball from GitHub, so no Subversion is needed.
      - name: Install WordPress ${{ matrix.wp }} and its test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 "${{ matrix.wp }}" false
      - name: Show the WordPress version under test
        env:
          REQUESTED: ${{ matrix.wp }}
        run: |
          installed=$(sed -n "s/^\$wp_version = '\([^']*\)';.*/\1/p" "$WP_CORE_DIR/wp-includes/version.php")
          echo "Requested WordPress $REQUESTED, installed WordPress $installed (PHP $(php -r 'echo PHP_VERSION;'), multisite=$WP_MULTISITE)"
          echo "::notice title=WordPress under test::Requested $REQUESTED, installed $installed, PHP ${{ matrix.php }}, multisite=$WP_MULTISITE"
          if [ "$REQUESTED" != "latest" ] && [ "${installed#"$REQUESTED"}" = "$installed" ]; then
            echo "::error::Asked for WordPress $REQUESTED but installed $installed"
            exit 1
          fi
          # tests/bootstrap.php stops the run if WordPress boots as the other kind of install; this
          # catches a matrix entry whose multisite value is missing or misspelled.
          if [ "$WP_MULTISITE" != "0" ] && [ "$WP_MULTISITE" != "1" ]; then
            echo "::error::WP_MULTISITE must be 0 or 1, got '$WP_MULTISITE'"
            exit 1
          fi
      - name: Run PHPUnit
        run: vendor/bin/phpunit --log-junit "$RUNNER_TEMP/phpunit-junit.xml"
      - name: No more skipped tests than expected
        env:
          MAX_SKIPPED: ${{ matrix.max_skipped }}
        run: |
          # shellcheck disable=SC2016 # The PHP code is single-quoted on purpose.
          skipped=$(php -r '$xml = simplexml_load_file($argv[1]); if (!$xml) { exit(1); } echo count($xml->xpath("//testcase[skipped]"));' "$RUNNER_TEMP/phpunit-junit.xml")
          echo "Skipped tests: $skipped (at most $MAX_SKIPPED expected on this leg)"
          if [ -z "$MAX_SKIPPED" ] || [ "$skipped" -gt "$MAX_SKIPPED" ]; then
            echo "::error::$skipped tests were skipped; this leg allows at most ${MAX_SKIPPED:-?}. See the skip reasons in the Run PHPUnit step."
            exit 1
          fi

  parity-js:
    name: HTML/JS parity (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 24 = current LTS; the .nvmrc line (26) is what local development runs.
        node: ['24', 'nvmrc']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node != 'nvmrc' && matrix.node || '' }}
          node-version-file: ${{ matrix.node == 'nvmrc' && '.nvmrc' || '' }}
      - name: JavaScript mode (Node)
        run: node tests/parity/run-js.mjs

  plugin-check:
    name: WordPress Plugin Check (WP ${{ matrix.wp }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        wp: ['latest', 'trunk']
    # trunk is an early warning for the next WordPress release; it never blocks.
    continue-on-error: ${{ matrix.wp == 'trunk' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - name: Build a clean distributable copy (same .distignore filter as the WP.org deploy)
        run: |
          mkdir -p build/local-pr-outbound-utm-tagger
          rsync -rc --exclude-from=.distignore ./ build/local-pr-outbound-utm-tagger/
          find build/local-pr-outbound-utm-tagger -type f | sort
      - name: Run Plugin Check
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: ./build/local-pr-outbound-utm-tagger
          slug: local-pr-outbound-utm-tagger
          wp-version: ${{ matrix.wp }}
      # The action passes on warnings; WP.org review doesn't. Make green mean zero findings.
      - name: Require zero Plugin Check findings
        run: |
          cat "$RUNNER_TEMP/plugin-check-results.txt"
          grep -qx 'Success: Checks complete. No errors found.' "$RUNNER_TEMP/plugin-check-results.txt"
