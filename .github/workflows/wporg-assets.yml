name: Update WordPress.org readme and art

# Pushes readme.txt and the .wordpress-org/ art to WordPress.org WITHOUT a new release, e.g. a
# "Tested up to" bump. Manual only, from main. It COMMITS FOR REAL (the 10up action has no dry run),
# so it asks for the slug to be typed as confirmation, and the full Test workflow must pass on the
# exact commit first. The action itself refuses if any shipped file other than readme.txt differs
# from the released trunk: code changes need a real release.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type outbound-utm-tagger to confirm a real commit to WordPress.org'
        type: string
        required: true

permissions:
  contents: read

jobs:
  guard:
    name: Confirmed, and running from main
    runs-on: ubuntu-24.04
    steps:
      - env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "outbound-utm-tagger" ]; then
            echo "::error::Confirmation did not match the slug; nothing was sent."
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this from main (got $GITHUB_REF)."
            exit 1
          fi

  test:
    name: Quality gates
    needs: guard
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ github.sha }}

  assets:
    name: WordPress.org readme + assets
    needs: [guard, test]
    runs-on: ubuntu-24.04
    # Same queue as real releases; queue: max keeps every waiting run instead of cancelling it.
    concurrency:
      group: wporg-svn
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Update readme + assets (10up)
        uses: 10up/action-wordpress-plugin-asset-update@2480306f6f693672726d08b5917ea114cb2825f7 # 2.2.0
        env:
          SLUG: outbound-utm-tagger
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
