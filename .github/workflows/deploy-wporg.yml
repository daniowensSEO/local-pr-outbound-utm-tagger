name: Deploy to WordPress.org

# Tag push (bare x.y.z, e.g. 0.2.3) = a REAL release to the WordPress.org plugin directory:
# SVN trunk + tags/<version>, plus assets/ from .wordpress-org/. Tags are pushed only with Dani's
# explicit OK.
# Manual run (Actions > Run workflow, "Use workflow from" = main) = ALWAYS a dry run. It rehearses
# releasing main's current header Version, which must not be published yet.
#
# Both paths test and deploy one exact commit (github.sha). Before anything touches SVN, the guard
# checks that the header Version, the readme Stable tag and the class VERSION agree, that the commit
# is on main, that a pushed tag still points at the commit this run tested, that the version is the
# highest tag, and that it isn't already on WordPress.org and isn't older than a published release.
# Needs repository secrets SVN_USERNAME and SVN_PASSWORD: the WP.org SVN password, not the account
# password.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Quality gates
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ github.sha }}

  deploy:
    name: WordPress.org SVN (${{ github.event_name == 'push' && 'release' || 'dry run' }})
    needs: test
    runs-on: ubuntu-24.04
    # Real releases (and wporg-assets.yml) take turns in one queue. queue: max keeps every waiting
    # run instead of letting a newer one cancel it. Dry runs never enter that queue.
    concurrency:
      group: ${{ github.event_name == 'push' && 'wporg-svn' || format('wporg-dry-run-{0}', github.run_id) }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Guard (version numbers, main, tag, WordPress.org state)
        id: guard
        run: |
          fail() { echo "::error::$*"; exit 1; }

          header=$(sed -n 's/^[ *]*Version:[[:space:]]*//p' outbound-utm-tagger.php | head -1 | tr -d '[:space:]')
          stable=$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt | head -1 | tr -d '[:space:]')
          class=$(sed -n "s/.*const VERSION = '\([^']*\)'.*/\1/p" includes/class-outbound-utm-settings.php | head -1)
          echo "header=$header stable=$stable class=$class event=$GITHUB_EVENT_NAME ref=$GITHUB_REF_NAME"
          printf '%s' "$header" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || fail "Version '$header' is not x.y.z"
          [ "$header" = "$stable" ] && [ "$header" = "$class" ] || fail "Version mismatch: header=$header, Stable tag=$stable, VERSION=$class"
          VERSION="$header"

          git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null || fail "origin/main was not fetched"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || fail "Commit $(git rev-parse --short HEAD) is not on main"

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            [ "$GITHUB_REF_NAME" = "$VERSION" ] || fail "Tag $GITHUB_REF_NAME does not match the plugin version $VERSION"
            [ "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$(git rev-parse HEAD)" ] \
              || fail "Tag $GITHUB_REF_NAME was moved after this run started; not deploying (the new tag's own run will test it)"
            highest=$(git tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            [ "$highest" = "$VERSION" ] || fail "$VERSION is not the highest release tag ($highest)"
          fi

          base="https://plugins.svn.wordpress.org/local-pr-outbound-utm-tagger"
          listing=$(curl -fsS --max-time 30 --retry 3 "$base/tags/") \
            || fail "Can't read $base/tags/ (plugin not approved yet, or WordPress.org is down)"
          published=$(printf '%s' "$listing" | grep -oE 'href="[0-9]+\.[0-9]+\.[0-9]+/"' | sed 's/^href="//; s#/"$##')
          echo "Published on WordPress.org: ${published:-none}"
          if printf '%s\n' "$published" | grep -qx "$VERSION"; then
            fail "$VERSION is already on WordPress.org. Bump the version; never re-tag a published one."
          fi
          newest=$(printf '%s\n%s\n' "$published" "$VERSION" | grep -v '^$' | sort -V | tail -1)
          [ "$newest" = "$VERSION" ] || fail "$VERSION is older than the published $newest"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Deploy (10up)
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        with:
          dry-run: ${{ github.event_name != 'push' }}
        env:
          SLUG: local-pr-outbound-utm-tagger
          VERSION: ${{ steps.guard.outputs.version }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
