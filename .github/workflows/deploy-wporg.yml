name: Deploy to WordPress.org

# Releases a tagged version to the WordPress.org plugin directory: SVN trunk + tags/<version>,
# plus assets/ from .wordpress-org/. A real release happens ONLY when a bare semver tag
# (e.g. 0.2.3) is pushed, and tags are pushed only with Dani's explicit OK.
# Manual runs are ALWAYS dry runs: they rehearse releasing an existing tag without committing.
# Needs repository secrets SVN_USERNAME and SVN_PASSWORD (the WP.org SVN password, not the
# account password). The quality gates in test.yml must pass first, on the tagged commit.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing git tag to rehearse, e.g. 0.2.2 (manual runs never commit to SVN)'
        type: string
        required: true

permissions:
  contents: read

# One WordPress.org write at a time (shared with wporg-assets.yml); never cancel one mid-commit.
concurrency:
  group: wporg-svn
  cancel-in-progress: false

jobs:
  test:
    name: Quality gates
    uses: ./.github/workflows/test.yml
    with:
      ref: refs/tags/${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

  deploy:
    name: WordPress.org SVN (${{ github.event_name == 'workflow_dispatch' && 'dry run' || 'release' }})
    needs: test
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - name: Version is bare semver
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$VERSION' is not a bare x.y.z version"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.VERSION }}
          fetch-depth: 0

      - name: Tag matches the plugin's version numbers and is on main
        run: |
          header=$(sed -n 's/^[ *]*Version:[[:space:]]*//p' outbound-utm-tagger.php | head -1 | tr -d '[:space:]')
          stable=$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt | head -1 | tr -d '[:space:]')
          class=$(sed -n "s/.*const VERSION = '\([^']*\)'.*/\1/p" includes/class-outbound-utm-settings.php | head -1)
          echo "tag=$VERSION header=$header stable=$stable class=$class"
          for v in "$header" "$stable" "$class"; do
            if [ "$v" != "$VERSION" ]; then
              echo "::error::Tag $VERSION does not match header=$header / Stable tag=$stable / VERSION=$class"
              exit 1
            fi
          done
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag $VERSION points at a commit that is not on main"
            exit 1
          fi

      - name: Deploy (10up)
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        with:
          dry-run: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          SLUG: outbound-utm-tagger
          VERSION: ${{ env.VERSION }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
